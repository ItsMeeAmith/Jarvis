version: "3.9"

services:
  backend:
    build: ./backend
    container_name: jarvis_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jarvis_net

  frontend:
    build: ./frontend
    container_name: jarvis_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - jarvis_net

  db:
    image: pgvector/pgvector:pg16
    container_name: jarvis_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis_net

  redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis_net

  nginx:
    image: nginx:alpine
    container_name: jarvis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - jarvis_net

volumes:
  pgdata:

networks:
  jarvis_net:
    driver: bridge
